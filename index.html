<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070a'/%3E%3Ccircle cx='16' cy='17' r='8' fill='%23e0231c'/%3E%3Crect x='4' y='8' width='24' height='2.6' fill='%23dfe7e0'/%3E%3Crect x='7' y='13' width='18' height='2' fill='%23dfe7e0'/%3E%3C/svg%3E">
<style>
  /* === threeui shared base === */
  .threeui-background,
  .landing-page-frame {
    position: relative;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .threeui-background {
    isolation: isolate;
    background: #030304;
  }

  /* === shader-frame: the sized, overflow-controlled parent === */
  *,*::before,*::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
  }
  .shader-frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
</style>
</head>
<body>
<div class="shader-frame">
  <div class="threeui-background landing-page-frame" data-state="loading" id="frame-host" style="position:relative;overflow:hidden;background:#080808;pointer-events:auto">
    <iframe
      id="kage-frame"
      title="Dwibon Bhargab Deka — AI, Security & Research"
      src="landing-pages/kage.html"
      sandbox="allow-downloads allow-forms allow-modals allow-popups allow-same-origin allow-scripts"
      loading="eager"
      style="position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#080808"
    ></iframe>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   Typography customization — applies the configured props:
     headingFont: "onest"
     bodyFont: "onest"
     headingWeight: "400"
     bodyWeight: "300"
     primaryColor: "#e0231c"
     headingSize: 46
     bodySize: 17
     headingLetterSpacing: -0.012

   These are the exact authored defaults for Kage, so the override CSS
   restates what the page already says — the document is unchanged at
   the defaults, and the system is ready for any future customization.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var STYLE_ID = 'threeui-page-typography';

  /* The Kage recipe with the configured props resolved at their defaults. */
  var css = [
    ':root {',
    '  --vermilion: #e0231c;',
    '  --ember: #ff5a3c;',
    '}',
    "body { font-family: 'Onest', system-ui, -apple-system, 'Helvetica Neue', sans-serif; }",
    'body, .body, .body-lg, .num { font-weight: 300; }',
    "h1:not(.jp), h2:not(.jp), h3:not(.jp), .display:not(.jp) {",
    "  font-family: 'Onest', system-ui, -apple-system, 'Helvetica Neue', sans-serif;",
    '  font-weight: 400;',
    '}',
    '.display { letter-spacing: -0.012em; }',
    '.h-hero { font-size: clamp(34px, 4.15vw, 60px); }',
    '.h-sec { font-size: clamp(30px, 4vw, 60px); }',
    '.body-lg { font-size: clamp(14px, 1.02vw, 17px); }',
    '.body { font-size: 14px; }',
  ].join('\n');

  function applyCustomization(frameDoc) {
    if (!frameDoc || !frameDoc.head) return;
    var style = frameDoc.getElementById(STYLE_ID);
    if (!style) {
      style = frameDoc.createElement('style');
      style.id = STYLE_ID;
    }
    if (style.textContent !== css) style.textContent = css;
    frameDoc.head.appendChild(style);
  }

  var frame = document.getElementById('kage-frame');
  var host = document.getElementById('frame-host');

  frame.addEventListener('load', function () {
    try {
      applyCustomization(frame.contentDocument);
    } catch (e) {
      /* cross-origin — the page works fine without the override */
    }
    host.setAttribute('data-state', 'ready');
  });
})();
</script>
</body>
</html>
